<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Review Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Submit Review</h2>
<form th:action="@{/submit}" th:object="${review}" method="post" class="mt-4">
    <div class="mb-3">
        <label>Date</label>
        <input type="date" th:field="*{date}" class="form-control" required/>
    </div>
    <div class="mb-3">
        <label>Location</label>
        <input type="text" th:field="*{location}" class="form-control" required/>
    </div>
    <div class="mb-3">
        <label>Company Name</label>
        <input type="text" th:field="*{companyName}" class="form-control" required/>
    </div>
    <div class="mb-3">
        <label>Rating (1-5)</label>
        <input type="number" th:field="*{rating}" min="1" max="5" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body>
</html>
