<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>

  <form method="POST" action="/login">
    <div>
      <label>Username:</label>
      <input type="text" name="username" required />
    </div>
    <div>
      <label>Password:</label>
      <input type="password" name="password" required />
    </div>
    <button type="submit">Login</button>
  </form>

  <p style="color: red;">
    <% if (error === "invalid") { %>
    Invalid username or password.
    <% } %>
  </p>

  <!-- Note: error is not rendered because this is plain HTML -->
  <!-- If you want dynamic error messages, use a template engine like EJS -->
</body>
</html>
